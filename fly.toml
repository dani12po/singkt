# fly.toml — Singkat deploy ke Fly.io
# Docs: https://fly.io/docs/reference/configuration/

app = "singkat"
primary_region = "sin" # Singapore — terdekat dari Indonesia

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV       = "production"
  PORT           = "3000"
  TRUST_PROXY    = "true"
  DATABASE_URL   = "file:/app/data/prod.db"

[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines   = true   # hemat quota gratis: VM mati saat idle
  auto_start_machines  = true   # nyala otomatis saat ada request
  min_machines_running = 0      # 0 = full free tier (cold start ~3-5 detik)

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size   = "shared-cpu-1x"   # free tier
  memory = "256mb"

# Volume persisten untuk SQLite — data tidak hilang saat redeploy
[[mounts]]
  source      = "singkat_data"
  destination = "/app/data"
  initial_size = "1gb"
